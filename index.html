<!DOCTYPE html>
<html>
<head>
  <title>Payment (Educational purposes Only)</title>
  <style>
    body {
      font-family: Arial;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .box {
      background: white;
      padding: 20px;
      width: 300px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.2);
    }
    input {
      width: 100%;
      padding: 8px;
      margin: 5px 0;
    }
    button {
      width: 100%;
      padding: 10px;
      background: green;
      color: white;
      border: none;
      cursor: pointer;
    }
    #msg {
      margin-top: 10px;
      color: blue;
      font-weight: bold;
    }
  </style>
</head>
<body>

<div class="box">
  <h3>Payment Form</h3>

  <input type="text" placeholder="First Name" id="fname">
  <input type="text" placeholder="Last Name" id="lname">
  <input type="text" placeholder="Contact Number" id="contact">

  <!-- ADDED FIELDS -->
  <input type="number" placeholder="Amount (₱)" id="amount">
  <input type="text" placeholder=" GCash Account Number" id="gcash">

  <button onclick="fakeSubmit()">Submit</button>

  <div id="msg"></div>
</div>

<script>
function fakeSubmit() {
  let amount = document.getElementById("amount").value;

  document.getElementById("msg").innerHTML =
  "✔ Congratulations! Payment of ₱" + amount +
  " successfully confirmed. Please wait 24 hours to receive your jackpot prize.";
}
</script>

</body>
</html>
